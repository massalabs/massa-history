# Massa indexer V2 (MVP-v0) — mainnet config template.

[general]
network = "mainnet"

[node]
grpc_url = "http://127.0.0.1:33037"
connect_timeout_ms = 5000
keepalive_ms = 15000

[db]
path = "./data/rocksdb"
compression = "lz4"
write_buffer_size_mb = 64

[rest]
bind = "127.0.0.1:8080"
cors = ["*"]
sse_ring_buffer_size = 10000
sse_heartbeat_secs = 20
default_page_size = 50
max_page_size = 500

[tokens]
enabled = true
rescan_pause_ms = 5
rescan_batch = 256
