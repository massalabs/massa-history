[package]
name = "massa-indexer"
version = "0.0.1"
edition = "2021"
rust-version = "1.81.0"
description = "Massa Indexer V2 — streams from a massa-node into RocksDB and exposes a REST+SSE API."
license = "MIT OR Apache-2.0"

[lib]
name = "massa_indexer"
path = "src/lib.rs"

[[bin]]
name = "massa-indexer"
path = "src/main.rs"

# NOTE: dependency versions are pinned to what builds cleanly on rustc 1.81
# (matching massa/rust-toolchain.toml). Newer releases of clap / tonic-build
# started requiring Rust 2024 edition which is unstable in 1.81.

[dependencies]
tokio = { version = "=1.40.0", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "net", "io-util"] }
tokio-stream = { version = "=0.1.16", features = ["sync"] }
futures = "=0.3.31"
async-stream = "=0.3.5"

tonic = { version = "=0.12.3", default-features = false, features = ["transport", "codegen", "prost"] }
prost = "=0.13.3"
prost-types = "=0.13.3"

axum = { version = "=0.7.7", features = ["macros", "tokio"] }
tower = "=0.5.1"
tower-http = { version = "=0.5.2", features = ["cors", "trace"] }

rocksdb = { version = "=0.22.0", default-features = false }

serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
# Base58-check decoding of Massa id / address strings into the fixed-length
# binary keys we store in RocksDB. `check` toggles the CRC-style 4-byte
# suffix that Massa's display format appends.
bs58 = { version = "=0.5.1", features = ["check"] }
toml = "=0.8.19"
base64 = "=0.22.1"
hex = "=0.4.3"
sha2 = "=0.10.8"
# CSV export for /v1/export/*.csv.
csv = "=1.3.0"
# HTTP client for the in-process healthcheck subcommand (hits /v1/health on
# the configured REST bind). We re-use the same hyper 1.x stack the tests
# use to stay on rustc 1.81.
hyper = { version = "=1.5.0", features = ["client", "http1", "http2"] }
hyper-util = { version = "=0.1.9", features = ["client-legacy", "tokio", "http1", "http2"] }
http-body-util = "=0.1.2"

tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter", "json"] }

anyhow = "=1.0.89"
thiserror = "=1.0.64"

bytes = "=1.7.2"
pin-project = "=1.1.6"
clap = { version = "=4.5.20", features = ["derive"] }
humantime-serde = "=1.1.1"

# Legacy block-storer DynamoDB fallback. We sign requests ourselves (SigV4)
# and use `reqwest` (with rustls) for the HTTP transport. Pulling in the
# full `aws-sdk-rust` is overkill for the single GetItem/Query pattern we
# need, and keeps the indexer's MSRV pinned to 1.81.
reqwest = { version = "=0.12.8", default-features = false, features = ["rustls-tls", "json", "http2"] }
hmac = "=0.12.1"

# jemalloc — recommended by RocksDB as a general-purpose allocator that keeps
# RSS bounded under the many-small-allocations workload of a write-heavy LSM
# store. See https://github.com/facebook/rocksdb/wiki/Memory-usage-in-RocksDB.
# The `background_threads` feature lets jemalloc run its own purge thread so
# we don't pay that cost on hot paths.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "=0.6.0", features = ["background_threads"] }

# Pinned transitive deps whose newer versions require edition2024 (unstable in 1.81).
hashbrown = "=0.15.2"
# `idna_adapter` 1.2+ is edition2024-only; pin to the last 1.1.x release that
# still compiles on rustc 1.81. Pulled in transitively via `reqwest -> idna`.
idna_adapter = "=1.1.0"

[features]
default = []
# Exposes the deterministic `mk_test_*` id factories so integration tests
# can share them with unit tests. The helpers are always compiled under
# `#[cfg(test)]`; this feature lets them escape the crate boundary too.
test-exports = []

[dev-dependencies]
tempfile = "=3.13.0"
proptest = "=1.5.0"
# Integration tests need the deterministic id factories exported from `ids.rs`.
massa-indexer = { path = ".", features = ["test-exports"] }

[build-dependencies]
tonic-build = { version = "=0.12.3", default-features = false, features = ["prost", "transport"] }
prost-build = "=0.13.3"
walkdir = "=2.5.0"

# Production release profile: link-time optimization + single codegen unit for
# smaller binaries and tighter inlining; strip debug symbols so the shipped
# artifact stays under 30MB. `panic = "abort"` matches how we want the process
# to fail in containers (supervisor restarts rather than unwinding stacks).
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
incremental = false
opt-level = 3
debug = false

# Integration tests link the lib + test harness; keep them buildable with
# debug info for useful stack traces when they fail in CI.
[profile.release.package."*"]
opt-level = 3
