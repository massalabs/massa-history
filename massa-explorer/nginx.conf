# nginx configuration for massa-explorer (Vite SPA + runtime config).
#
# Serves on :8080 so the image can run as the unprivileged `nginx` user.
# Behind a TLS reverse proxy (nginx, Caddy, Traefik, Cloudflare, …) you only
# need to forward http(s) to this port.

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Security headers. CORS is handled by the upstream indexer; the explorer
    # itself serves static assets only.
    add_header  X-Content-Type-Options "nosniff" always;
    add_header  X-Frame-Options         "SAMEORIGIN" always;
    add_header  Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header  Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;

    # Aggressive caching for hashed assets, no cache for the HTML shell and
    # the runtime config file (so operators can hot-swap endpoints without
    # clients missing the change).
    location /assets/ {
        access_log off;
        expires    1y;
        add_header Cache-Control "public, immutable" always;
        try_files  $uri =404;
    }

    location = /config.js {
        add_header Cache-Control "no-store" always;
        try_files  $uri =404;
    }

    location = /robots.txt {
        access_log off;
        try_files  $uri =404;
    }

    # Cheap liveness endpoint used by the Dockerfile HEALTHCHECK.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # SPA fallback: any unmatched route serves index.html so React Router can
    # render the correct page. The shell itself is never cached.
    location / {
        add_header Cache-Control "no-store" always;
        try_files  $uri $uri/ /index.html;
    }

    # Lock down methods we never serve.
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    # Drop the default nginx server tokens.
    server_tokens off;
}
